# Application Configuration
spring.application.name=doc-to-pdf-converter
server.port=${PORT:2233}

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JODConverter Configuration
jodconverter.local.enabled=true
jodconverter.local.office-home=C:/Program Files/LibreOffice
jodconverter.local.port-numbers=2002,2003 
jodconverter.local.process-timeout=120000  
jodconverter.local.process-retry-interval=1000  
jodconverter.local.max-tasks-per-process=200
jodconverter.local.task-execution-timeout=60000  
jodconverter.local.task-queue-timeout=30000  
# Logging Configuration
logging.level.org.jodconverter=DEBUG
logging.level.com.converter.doctopdf=DEBUG
logging.level.org.springframework.web=INFO

