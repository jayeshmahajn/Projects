

services:
  doc-to-pdf:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: doc-to-pdf
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseContainerSupport
        - LIBREOFFICE_HOME=/usr/lib/libreoffice
  
    volumes:
      # Mount temp directory for better performance
      - /tmp:/tmp
      # Optional: Mount for persistent logs
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - doc-converter-network
    # Resource limits (optional but recommended)
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Optional: Add nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: doc-to-pdf-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # For SSL certificates
    depends_on:
      - doc-to-pdf
    restart: unless-stopped
    networks:
      - doc-converter-network
    profiles:
      - production  # Only start with --profile production

  # Optional: Add Redis for session management in scaled environments
  redis:
    image: redis:7-alpine
    container_name: doc-to-pdf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - doc-converter-network
    profiles:
      - scaled  # Only start with --profile scaled

networks:
  doc-converter-network:
    driver: bridge

volumes:
  redis_data:
    driver: local



