# Server configuration
server.port=2233
server.max-http-request-header-size=64KB

# Multipart configuration for file uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Logging configuration
logging.level.org.jodconverter=DEBUG
logging.level.com.converter.doctopdf=DEBUG
logging.level.root=INFO

# # JODConverter specific settings
# jodconverter.local.enabled=true
# jodconverter.local.office-home=/usr/lib/libreoffice
# jodconverter.local.port-numbers=2002,2003,2004
# jodconverter.local.process-timeout=120000
# jodconverter.local.process-retry-interval=1000
# jodconverter.local.task-execution-timeout=300000
# jodconverter.local.max-tasks-per-process=50
# jodconverter.local.task-queue-timeout=30000

# LibreOffice configuration
jodconverter.local.office-home=/usr/lib/libreoffice
jodconverter.local.port-numbers=2002,2003
jodconverter.local.process-timeout=300000
jodconverter.local.task-execution-timeout=300000
jodconverter.local.task-queue-timeout=60000
jodconverter.local.max-tasks-per-process=100